name: Knowledge service checks

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'knowledge/**'
      - 'services/knowledge/**'
      - 'src/pages/connect*'
      - 'docusaurus.config.js'
      - '.github/workflows/knowledge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-and-integration:
    name: Knowledge security and integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/knowledge
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked service dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded PDF parser
        run: python -m pip install -r requirements-pdf.txt
      - name: Test PDF decompression and process boundaries
        run: python -m unittest discover -s tests -p 'test_pdf_*.py' -v
      - name: Check types
        run: pnpm typecheck
      - name: Build approved GitHub knowledge
        run: pnpm knowledge:build
      - name: Run security and integration tests
        run: pnpm test
      - name: Bundle the storage-free Worker without deploying
        run: pnpm build

  publish:
    name: Publish approved knowledge
    needs: security-and-integration
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.KNOWLEDGE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: knowledge-staging
    defaults:
      run:
        working-directory: services/knowledge
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install bounded PDF parser
        run: python -m pip install -r requirements-pdf.txt
      - name: Build approved knowledge from this commit
        run: pnpm knowledge:build
      - name: Verify free-only account and deploy bundled knowledge
        run: pnpm deploy:knowledge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          KNOWLEDGE_PUBLIC_MCP_URL: ${{ vars.KNOWLEDGE_PUBLIC_MCP_URL }}
